; OPcache khusus proyek SIKEBUT-API (di-load via PHP_INI_SCAN_DIR saat start server).
; Latar: tanpa opcache, tiap request mengompilasi ulang seluruh Laravel (~1,4 dtk).
; Aktif juga untuk CLI (artisan serve = PHP built-in server = SAPI cli-server).
zend_extension="C:\laragon\bin\php\php 8.3\ext\php_opcache.dll"

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=32531
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.jit_buffer_size=0
