x-logging: &default-logging
    driver: "json-file"
    options:
        max-size: "20m"
        max-file: "5"

services:
    nginx:
        image: nginx:alpine
        container_name: sikebut-api-nginx
        restart: unless-stopped
        ports:
            - "8086:80"
        volumes:
            - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
            # - ./docker/nginx/ssl:/etc/letsencrypt:ro
            - public:/var/www/public:ro
            - storage:/var/www/storage:ro
        depends_on:
            sikebut-api:
                condition: service_healthy
        networks:
            - app-network
        deploy:
            resources:
                limits: { cpus: "0.500", memory: 256M }
                reservations: { cpus: "0.100", memory: 64M }
        logging: *default-logging

    sikebut-api:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: sikebut-api:1.0.0
        container_name: sikebut-api-app
        restart: unless-stopped
        expose: ["9000"]
        env_file: .env
        volumes:
            - public:/var/www/public
            - storage:/var/www/storage
        networks:
            - app-network
        deploy:
            resources:
                limits: { cpus: "1.000", memory: 1024M }
                reservations: { cpus: "0.500", memory: 512M }
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 3
        logging: *default-logging

    queue:
        image: sikebut-api:1.0.0
        container_name: sikebut-api-queue
        restart: unless-stopped
        # Driver WAJIB sama dengan QUEUE_CONNECTION di .env (proyek ini: database).
        # Memakai "redis" tanpa container Redis membuat worker gagal terus-menerus.
        command:
            [
                "php",
                "artisan",
                "queue:work",
                "database",
                "--tries=3",
                "--max-time=3600",
                "--backoff=30",
            ]
        stop_signal: SIGTERM
        # 600s (bukan 60s): satu impor SIPD berkas asli (± 39 ribu baris) berjalan
        # ± 8 menit sebagai SATU job. Dengan 60s, restart/deploy di tengah impor
        # akan mematikan worker paksa dan impor itu gagal (job tidak mengulang,
        # karena RunImportJob menetapkan $tries = 1).
        stop_grace_period: 600s
        env_file: .env
        volumes:
            - storage:/var/www/storage
        networks:
            - app-network
        deploy:
            resources:
                limits: { cpus: "0.750", memory: 768M }
                reservations: { cpus: "0.250", memory: 384M }
        logging: *default-logging

    scheduler:
        image: sikebut-api:1.0.0
        container_name: sikebut-api-scheduler
        restart: unless-stopped
        command: ["php", "artisan", "schedule:work"]
        env_file: .env
        networks:
            - app-network
        deploy:
            resources:
                limits: { cpus: "0.250", memory: 256M }
        logging: *default-logging

networks:
    # Hanya app-network yang dibutuhkan: api, queue, scheduler, WA gateway, dan
    # frontend saling terhubung di sini. Database SIKEBUT berada di HOST TERPISAH
    # (lihat DB_HOST pada .env), jadi network khusus database TIDAK diperlukan —
    # network `external` yang tidak ada akan membuat `docker compose up` GAGAL.
    # Bila kelak PostgreSQL dijalankan di Docker yang sama, tambahkan lagi:
    #   db-network:
    #       external: true
    #       name: db-network
    app-network:
        external: true
        name: app-network

volumes:
    storage:
        name: sikebut-storage
    public:
        name: sikebut-public
