# Rate limiting zone (mencegah DoS / spam flood ke IP publik)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=addr_conn:10m;


#server {
#    listen 80;
#    server_name _;
#    return 301 https://$host$request_uri;
#}

server {
    # listen 443 ssl http2;
    listen 80 default_server;
    server_name _;
    root /var/www/public;
    index index.php;

    # ssl_certificate /etc/letsencrypt/live/api.sikebut.example.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.sikebut.example.id/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25m;
    server_tokens off;

    # Batasi koneksi simultan per IP (anti Slowloris)
    limit_conn addr_conn 25;

    # Security Headers dasar
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Blokir scanner bot mencari file sensitif (.env, .git, config, dll)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blokir probe exploit skrip luar (asp, aspx, jsp, dll)
    location ~* \.(aspx|asp|jsp|cgi|pl)$ {
        return 404;
    }

    # Cegah eksekusi PHP di folder upload/storage
    location ^~ /storage/ {
        try_files $uri =404;
        location ~ \.php$ {
            deny all;
        }
    }

    # Rate limit ketat khusus endpoint login
    location /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Routing umum Laravel + rate limit
    location / {
        limit_req zone=api_limit burst=30 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Eksekusi PHP via PHP-FPM container
    location ~ \.php$ {
        fastcgi_pass sikebut-api-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_hide_header X-Powered-By;
    }
}
