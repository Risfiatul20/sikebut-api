; Impor SIPD/RKBMD memuat ribuan baris sekaligus -> batas dinaikkan.
; Wajib sejalan dengan nginx: client_max_body_size (docker/nginx/conf.d/default.conf)
; dan batas unggah di reverse proxy AA Panel.
memory_limit = 1024M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 600
date.timezone = Asia/Jakarta
expose_php = Off
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = tracing
realpath_cache_size = 4096k
realpath_cache_ttl = 600
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source
; CATATAN: fungsi di atas dimatikan demi keamanan. Bila kelak ada fitur yang
; butuh Symfony Process (mis. backup paket), hapus proc_open dari daftar ini.
