[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

; ============================================================
; CATATAN: berkas ini hanya untuk mode "satu container" (supervisor di dalam
; image PHP). Compose SIKEBUT TIDAK memakainya — worker queue & scheduler
; dijalankan sebagai service terpisah (lihat docker-compose.yml).
; Kode di bawah sudah disesuaikan: path image = /var/www (bukan /var/www/html)
; dan driver queue = database (bukan redis, karena tidak ada container Redis).
; ============================================================
[program:laravel-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work database --tries=3 --max-time=3600 --backoff=30
directory=/var/www
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue.log
stopwaitsecs=3600
